<p ><font size="3" face="Verdana, Arial, Helvetica, sans-serif">The Spacebar is used to put a space between words. You should rest both thumbs lightly on the Spacebar when you type.</font></p> 
<p ><font size="3" face="Verdana, Arial, Helvetica, sans-serif">Always use your <strong>right-hand thumb </strong>to press the Spacebar.</font></p>
