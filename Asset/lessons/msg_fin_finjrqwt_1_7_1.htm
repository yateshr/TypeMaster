<p><font size="3" face="Verdana, Arial, Helvetica, sans-serif">Korjausnäppäimellä voit mennä taaksepäin ja korjata virheitä. Testeissä saat käyttää korjausnäppäintä, ellei opettaja ole estänyt sen käyttöä.</font></p>

<p><font size="3" face="Verdana, Arial, Helvetica, sans-serif">Korjausnäppäintä painetaan oikean käden pikkusormella. Se on melko vaikeaa ja hidastaa kirjoittamista. Älä siis käytä sitä liian paljon.</font></p>
